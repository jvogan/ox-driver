name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.20.0"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install host prerequisites when absent
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            if ! command -v shellcheck >/dev/null 2>&1; then
              brew install shellcheck
            fi
            if ! command -v rg >/dev/null 2>&1; then
              brew install ripgrep
            fi
          else
            sudo apt-get update
            sudo apt-get install -y shellcheck bubblewrap socat ripgrep
            if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
              sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
            fi
          fi
      - run: shellcheck skills/ox-driver/assets/bin/pi-guard
      - name: Scan committed content for secrets
        if: runner.os == 'Linux'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: python3 -m pip install skills-ref==0.1.1
      - run: agentskills validate skills/ox-driver
      - run: python3 scripts/validate.py
      - run: python3 scripts/test_setup.py
      - run: python3 scripts/test_install_reviewed_pi.py
      - run: python3 scripts/test_guard_install.py
      - run: python3 scripts/verify_provenance.py
      - run: npm_config_registry=https://registry.npmjs.org npm_config_ignore_scripts=true npx --yes skills@1.5.23 add . --list
